<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Sun Glow / Sun Center Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Energy Orbit Rings -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Solar Corona Rays -->
  <g stroke="url(#sunGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <!-- Cardinal rays -->
    <line x1="256" y1="90" x2="256" y2="120" />
    <line x1="256" y1="392" x2="256" y2="422" />
    <line x1="90" y1="256" x2="120" y2="256" />
    <line x1="392" y1="256" x2="422" y2="256" />
    <!-- Diagonal rays -->
    <line x1="138" y1="138" x2="160" y2="160" />
    <line x1="352" y1="352" x2="374" y2="374" />
    <line x1="138" y1="374" x2="160" y2="352" />
    <line x1="352" y1="160" x2="374" y2="138" />
  </g>

  <!-- Golden Sun Core -->
  <circle cx="256" cy="256" r="92" fill="url(#sunGrad)" filter="url(#sunGlow)" />

  <!-- Inner High-Tech Electric Energy Lightning Bolt -->
  <path d="M 276 156
           L 204 268
           L 252 268
           L 236 356
           L 308 244
           L 260 244
           Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linejoin="round" />
</svg>
